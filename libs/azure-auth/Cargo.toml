[package]
name = "factory-azure-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# A minimal Azure Managed Identity TokenCredential (MSI/IMDS) over the rustls reqwest in
# the tree — shared by libs/blob (Blob StorageCredentials) and, in P8 part 2, the
# dispatcher (ARM token for Container Apps Jobs). Deliberately NOT azure_identity, whose
# default oauth2→native-tls would drag openssl into a stack that drops it.
async-trait.workspace = true
azure_core.workspace = true
reqwest.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
