[package]
name = "factory-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tar.workspace = true
flate2.workspace = true
azure_core.workspace = true
azure_storage.workspace = true
azure_storage_blobs.workspace = true
# Managed Identity credential (P8): a minimal MSI/IMDS TokenCredential over the rustls
# reqwest already in the tree — avoids azure_identity (whose default oauth2→native-tls
# would pull openssl back in, which the whole stack deliberately drops).
reqwest.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
