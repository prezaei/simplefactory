[package]
name = "factory-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tar.workspace = true
flate2.workspace = true
azure_core.workspace = true
azure_storage.workspace = true
azure_storage_blobs.workspace = true
# Managed Identity credential (P8) — shared crate (also used by the dispatcher's Container
# Apps launcher in part 2), so the MSI/IMDS token logic lives in exactly one place.
factory-azure-auth.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
