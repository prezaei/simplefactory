[package]
name = "factory-github"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true }
octocrab.workspace = true
# Direct deps so OctocrabGitHub can build the App JWT client: octocrab takes a
# `jsonwebtoken::EncodingKey` (not re-exported) and returns the token as a
# `secrecy::SecretString`. Pinned to the versions octocrab 0.51 resolves to.
jsonwebtoken = "10"
secrecy = "0.10"

[dev-dependencies]
tokio.workspace = true
