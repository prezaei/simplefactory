[package]
name = "factory-dispatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "factory_dispatcher"
path = "src/lib.rs"

[[bin]]
name = "factory-dispatcher"
path = "src/main.rs"

[dependencies]
factory-record.workspace = true
factory-config.workspace = true
factory-github.workspace = true
factory-telemetry.workspace = true
# P8: the Container Apps Jobs launcher gets an ARM token from the shared MI credential and
# POSTs the job-start over the rustls reqwest already in the tree (no openssl).
factory-azure-auth.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[dev-dependencies]
factory-record.workspace = true
factory-config.workspace = true
factory-github.workspace = true
async-trait.workspace = true
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
sqlx.workspace = true
