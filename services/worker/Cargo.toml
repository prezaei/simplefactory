[package]
name = "factory-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "factory_worker"
path = "src/lib.rs"

[[bin]]
name = "factory-worker"
path = "src/main.rs"

[dependencies]
factory-telemetry.workspace = true
factory-blob.workspace = true
tracing.workspace = true
anyhow.workspace = true
base64 = "0.22"
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["process", "fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
factory-tools.workspace = true
factory-record.workspace = true
factory-github.workspace = true
factory-config.workspace = true
axum.workspace = true
