[workspace]
resolver = "2"
members = [
    "libs/telemetry",
    "libs/config",
    "libs/record",
    "libs/github",
    "libs/blob",
    "services/intake",
    "services/dispatcher",
    "services/coordinator",
    "services/tools",
    "services/dashboard-api",
    "services/worker",
    "e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Cross-cutting — used in P0
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database + async (wired in P1)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde_json = "1"

# Web + GitHub webhooks (wired in P2)
axum = "0.7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
cron = "0.16"
tower = { version = "0.5", features = ["util"] }

# Outbound GitHub + worker/tools HTTP + async traits (P3). octocrab's defaults are
# rustls-based (no OpenSSL) and include built-in GitHub App / installation-token auth.
octocrab = "0.51"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

# Worktree/session checkpoint archives (P7 crash-resume): tar + gzip the worktree to Blob.
tar = "0.4"
flate2 = "1"

# Azure Blob storage (P7): the production CheckpointStore/TranscriptStore, exercised
# locally against Azurite and against real Azure in P8. 0.21 is the line that supports
# shared-key/emulator auth (Azurite); the GA 1.0 crate is TokenCredential-only and is the
# P8 swap once we move to managed identity. See docs/factory-implementation-plan.md P7.
# rustls (not native-tls/openssl) to match the rest of the stack — keeps the runtime
# images openssl-free (no libssl needed) and pure-Rust HMAC for shared-key signing.
azure_core = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls"] }
azure_storage = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
azure_storage_blobs = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }

# Reserved for later phases (declared for intent; only fetched once a crate uses them):
# octocrab + jsonwebtoken (P3 GitHub App auth / installation tokens / Checks-PR API),
# opentelemetry + opentelemetry-otlp (P8 telemetry export).

# Internal crates
factory-telemetry = { path = "libs/telemetry" }
factory-config = { path = "libs/config" }
factory-record = { path = "libs/record" }
factory-github = { path = "libs/github" }
factory-blob = { path = "libs/blob" }
factory-intake = { path = "services/intake" }
factory-tools = { path = "services/tools" }
factory-dispatcher = { path = "services/dispatcher" }
factory-coordinator = { path = "services/coordinator" }
