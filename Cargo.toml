[workspace]
resolver = "2"
members = [
    "libs/telemetry",
    "libs/config",
    "libs/record",
    "libs/github",
    "libs/blob",
    "services/intake",
    "services/dispatcher",
    "services/coordinator",
    "services/tools",
    "services/dashboard-api",
    "services/worker",
    "e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Cross-cutting — used in P0
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database + async (wired in P1)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde_json = "1"

# Web + GitHub webhooks (wired in P2)
axum = "0.7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
cron = "0.16"
tower = { version = "0.5", features = ["util"] }

# Reserved for later phases (declared for intent; only fetched once a crate uses them):
# octocrab + jsonwebtoken (P3 GitHub App auth / installation tokens / Checks-PR API),
# azure_storage_blobs (P3 blob), opentelemetry + opentelemetry-otlp (P7 telemetry export).

# Internal crates
factory-telemetry = { path = "libs/telemetry" }
factory-config = { path = "libs/config" }
factory-record = { path = "libs/record" }
factory-github = { path = "libs/github" }
factory-blob = { path = "libs/blob" }
factory-intake = { path = "services/intake" }
