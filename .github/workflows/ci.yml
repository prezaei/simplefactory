name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: shellcheck · actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Operator scripts (deploy/verify/smoke) ship real behavior but aren't exercised by the
      # Rust suite — gate them so they can't rot (a wrong `az` flag in the migrate poll once
      # slipped every review). shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        # Pin both the installer script (fetched from a tagged release, NOT the floating `main`
        # branch) and the actionlint version it installs, so CI is reproducible and a change to
        # upstream `main` cannot silently alter what runs without a code change here.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        # Compiles the full E2E acceptance suite (ignored stubs run as skipped,
        # so the contract list can't silently rot) and runs all active tests.
        # DB-backed tests skip cleanly here (no DATABASE_URL); the integration
        # job below runs them against Postgres. --locked: CI must build the
        # committed Cargo.lock, never silently resolve new versions.
        run: cargo test --locked --all

  bicep:
    name: bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      # `az bicep build` exits 0 even with lint warnings, so capture diagnostics
      # (stderr, kept separate from the ARM JSON via --outfile) and fail on ANY
      # Warning/Error — the IaC equivalent of clippy `-D warnings`. The
      # `use_binary_from_path` notice is a local-config artifact, not a template
      # diagnostic, so it's filtered out.
      # Match only real Bicep diagnostics (`<file>(L,C) : Warning|Error CODE: ...`) so a
      # benign az-CLI stderr notice can't false-fail the gate, and a real warning can't slip
      # through. Bicep writes diagnostics to stderr and exits 0 even on warnings.
      - name: Build main.bicep (warnings = errors)
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --outfile /tmp/main.arm.json 2>/tmp/bicep.diag
          diags=$(grep -E ' : (Warning|Error) ' /tmp/bicep.diag || true)
          if [ -n "$diags" ]; then echo "$diags"; echo "bicep diagnostics above"; exit 1; fi
      - name: Build param files
        run: |
          set -euo pipefail
          for p in dev prod; do
            az bicep build-params --file "infra/main.$p.bicepparam" \
              --outfile "/tmp/main.$p.params.json" 2>"/tmp/$p.diag"
            diags=$(grep -E ' : (Warning|Error) ' "/tmp/$p.diag" || true)
            if [ -n "$diags" ]; then echo "$diags"; exit 1; fi
          done

  integration:
    name: integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://factory:factory@localhost:5432/factory?sslmode=disable
      # The Azure Blob (Azurite) connection string that gates the libs/blob integration
      # tests (the production CheckpointStore/TranscriptStore). Mirrors the local Azurite
      # well-known dev account; pointed at the emulator started below. Without this the
      # blob round-trip tests skip cleanly (like the DATABASE_URL gate).
      FACTORY_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Azurite (Azure Blob emulator) for the blob integration lane — started from the
      # committed docker-compose.yml so the image/command/healthcheck have ONE source of
      # truth (no CI-vs-compose drift). `--wait` blocks until its healthcheck passes.
      # This is what makes the *production* Azure store path CI-tested rather than
      # first-run-in-prod (P7).
      - name: Start Azurite
        run: docker compose up -d --wait azurite
      # Migration gate (activated in P1+, when migrations/ has content):
      # - run: cargo install sqlx-cli --no-default-features --features native-tls,postgres
      # - run: cargo sqlx migrate run
      - name: Integration tests
        run: cargo test --locked --all
